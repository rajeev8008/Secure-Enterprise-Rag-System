name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: test-secret-key-that-is-at-least-32-characters
      DATABASE_URL: sqlite://
      QDRANT_URL: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app alembic benchmark evaluation
      - name: Run test suite
        run: python -m pytest -q

  migration:
    name: PostgreSQL migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enterprise_rag
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d enterprise_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: test-secret-key-that-is-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://app:ci-password@localhost:5432/enterprise_rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Verify current migration
        run: python -m alembic current --check-heads

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: secure-enterprise-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
