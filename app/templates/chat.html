<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat | FinSolve</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:15px system-ui,sans-serif}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr auto;max-width:960px;margin:auto;background:white;border-inline:1px solid #e2e8f0}header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #e2e8f0}.identity strong,.identity span{display:block}.identity span,.categories{color:#64748b;font-size:.85rem}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.7rem 1rem}.logout{background:#eef2ff;color:#3730a3}.messages{overflow:auto;padding:1.5rem}.empty{text-align:center;color:#64748b;margin:15vh auto}.suggestions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}.suggestions button{background:#eff6ff;color:#1d4ed8}.message{max-width:78%;padding:.85rem 1rem;margin:.7rem 0;border-radius:14px;white-space:pre-wrap}.user{margin-left:auto;background:#1d4ed8;color:white}.assistant{background:#f1f5f9}.refusal{border-left:4px solid #f59e0b}.citations{display:grid;gap:.45rem;margin-top:.7rem}.citation{font-size:.82rem;background:white;border:1px solid #dbe3ef;border-radius:8px;padding:.55rem}.composer{display:flex;gap:.6rem;padding:1rem;border-top:1px solid #e2e8f0}textarea{flex:1;resize:none;min-height:46px;max-height:130px;padding:.75rem;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.send{background:#1d4ed8;color:white;font-weight:700}.send:disabled{opacity:.6}@media(max-width:600px){.message{max-width:92%}.categories{display:none}}
</style></head><body><main class="shell"><header><div class="identity"><strong>{{ user.email }}</strong><span>{{ user.role }} · <span class="categories">{{ categories|join(', ') }}</span></span></div><button class="logout" id="logout">Log out</button></header>
<section class="messages" id="messages" aria-live="polite"><div class="empty" id="empty"><h1>Ask FinSolve</h1><p>Answers use only documents available to your role.</p><div class="suggestions"><button>What is the leave policy?</button><button>Summarize the company handbook.</button></div></div></section>
<form class="composer" id="composer"><textarea id="question" maxlength="2000" required placeholder="Ask a question…" aria-label="Question"></textarea><button class="send" id="send">Send</button></form></main>
<script>
const messages=document.querySelector('#messages'),empty=document.querySelector('#empty'),form=document.querySelector('#composer'),input=document.querySelector('#question'),send=document.querySelector('#send');
function add(text,kind,data){empty?.remove();const box=document.createElement('article');box.className='message '+kind+(data?.refused?' refusal':'');box.textContent=text;if(data?.citations?.length){const list=document.createElement('div');list.className='citations';data.citations.forEach(c=>{const card=document.createElement('div');card.className='citation';card.textContent=`${c.filename} · ${c.category} · ${c.section_or_row} · score ${c.score}`;list.append(card)});box.append(list)}messages.append(box);messages.scrollTop=messages.scrollHeight;return box}
async function ask(text){add(text,'user');send.disabled=true;const loading=add('Thinking…','assistant');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});if(r.status===401){location.replace('/login');return}if(!r.ok)throw new Error();const data=await r.json();loading.remove();add(data.answer,'assistant',data)}catch{loading.textContent='The request could not be completed. Please try again.'}finally{send.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(value){input.value='';ask(value)}});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll('.suggestions button').forEach(b=>b.addEventListener('click',()=>ask(b.textContent)));document.querySelector('#logout').addEventListener('click',async()=>{await fetch('/auth/logout',{method:'POST'});location.replace('/login')});
</script></body></html>
