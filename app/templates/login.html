<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | FinSolve</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#172033;font:16px system-ui,sans-serif}.card{width:min(92vw,400px);padding:2rem;background:white;border:1px solid #dce3ef;border-radius:18px;box-shadow:0 18px 50px #243b6418}h1{margin:.25rem 0}.muted{color:#64748b;margin:.4rem 0 1.5rem}label{display:block;font-weight:650;margin-top:1rem}input,button{width:100%;font:inherit;border-radius:10px;padding:.8rem;margin-top:.4rem}input{border:1px solid #cbd5e1}input:focus{outline:3px solid #bfdbfe;border-color:#2563eb}button{border:0;background:#1d4ed8;color:white;font-weight:700;cursor:pointer;margin-top:1.3rem}button:disabled{opacity:.65;cursor:wait}.error{min-height:1.3rem;color:#b91c1c;margin:.8rem 0 0}
  </style>
</head>
<body><main class="card"><p class="muted">Secure Enterprise RAG</p><h1>Welcome back</h1><p class="muted">Sign in with your company account.</p>
  <form id="login"><label for="email">Username</label><input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
  <button id="submit" type="submit">Sign in</button><p id="error" class="error" role="alert"></p></form></main>
<script>
const form=document.querySelector('#login'),button=document.querySelector('#submit'),error=document.querySelector('#error');
fetch('/auth/me').then(r=>{if(r.ok)location.replace('/chat')});
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Signing in…';error.textContent='';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value,password:form.password.value})});if(!r.ok){error.textContent=r.status===401?'Invalid username or password.':'Unable to sign in.';return}location.replace('/chat')}catch{error.textContent='Unable to connect. Try again.'}finally{button.disabled=false;button.textContent='Sign in'}});
</script></body></html>
